version: '3.8'

services:
  fastapi-pdf:
    build: .
    container_name: ${CONTAINER_NAME_CUSTOM:-fastapi_pdf_service}
    ports:
      - "${FASTAPI_PDF_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - UPLOAD_DIR=/app/data/uploads
      - SUMMARY_DIR=/app/data/summaries
      - SECRET_KEY=rafa2802 # Lembre-se de trocar por uma chave mais segura
      - TZ=America/Sao_Paulo
    volumes:
      # Todas as pastas importantes agora são LOCAIS e de fácil acesso
      - ./data/uploads:/app/data/uploads
      - ./data/summaries:/app/data/summaries
      - ./app_data:/app/data                 # <--- BASE DE DADOS VIVA FICA AQUI
      - ./processed_zips:/app/processed_zips # <--- ZIPS PROCESSADOS FICAM AQUI
      - ./backups:/app/backups               # <--- BACKUPS .zip FICAM AQUI
