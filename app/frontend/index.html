<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BobIA</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <script src="bob.js"></script>
</head>
<body>
  <div class="video-container">
    <img src="./meu_gif.gif" alt="Plano de fundo animado" id="backgroundGif">
  </div>

  <div class="container">
    <h1>Enviar PDF para Processamento</h1>

    <input type="file" id="pdfInput" accept="application/pdf" />
    <label for="pdfInput" class="custom-file-upload">
      <i class="fas fa-cloud-upload-alt"></i> Escolher Arquivo PDF
    </label>

    <button onclick="uploadPDF()">Enviar</button>

    <div class="progress-container hidden" id="progressSection">
      <h3>Status de Processamento</h3>
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="statusText">Aguardando...</div>
    </div>

    <div id="downloadContainer" class="hidden">
      <a id="downloadLink" href="#" download>📦 Baixar Arquivo ZIP</a>
    </div>
  </div>

  <footer>
    <p>Feito por Henrique e Rafael @ SETI/PR</p>
  </footer>


</body>
</html>
