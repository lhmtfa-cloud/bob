<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BobIA</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
  <div class="video-container">
    <img src="/static/meu_gif.gif" alt="Plano de fundo animado" id="backgroundGif">
  </div>

  <div class="container">
    <div class="header-nav">
      <div class="header-nav-left">
        <span id="welcome-message"></span>
      </div>
      <div class="header-nav-right">
        <a id="admin-link" href="/admin" class="nav-link" style="display: none;">Painel Admin</a>
        <button id="settings-btn" class="nav-button">
            <i class="fas fa-cog"></i>
        </button>
        <button id="logout-button" class="nav-button">Sair</button>
      </div>
    </div>
    
    <h1>Enviar PDF para Processamento</h1>

    <input type="file" id="pdfInput" accept="application/pdf" />
    <label for="pdfInput" class="custom-file-upload">
      <i class="fas fa-cloud-upload-alt"></i> Escolher Arquivo PDF
    </label>

    <button onclick="uploadPDF()">Enviar</button>

    <div class="progress-container hidden" id="progressSection">
      <h3>Status de Processamento</h3>
      <progress id="progressBar" value="0" max="100"></progress>
      <div id="statusText">Aguardando...</div>
    </div>

    <div id="downloadContainer" class="hidden">
      <a id="downloadLink" href="#" download></a>
    </div>
  </div>

  <div id="settings-modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Configurações</h2>
      <form id="password-change-form">
        <h3>Alterar Palavra-passe</h3>
        <div class="form-group">
          <label for="current-password">Palavra-passe Atual</label>
          <input type="password" id="current-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">Nova Palavra-passe</label>
          <input type="password" id="new-password" required>
        </div>
        <button type="submit">Guardar Alterações</button>
        <p id="password-change-status" class="error-text"></p>
      </form>
      <hr style="border-color: var(--border-color); margin: 20px 0;">
      <div class="settings-row">
        <span>Modo Escuro</span>
        <label class="switch">
          <input type="checkbox" id="dark-mode-toggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <footer>
    <p>Feito por Henrique e Rafael @ SETI/PR</p>
  </footer>
  
  <script src="/static/bob.js"></script>
</body>
</html>
