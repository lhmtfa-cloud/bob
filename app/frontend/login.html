<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - BobIA</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="video-container">
    <img src="/static/meu_gif.gif" alt="Plano de fundo animado" id="backgroundGif">
  </div>

  <div class="container" style="max-width: 450px;">
    <h1>Login BobIA</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Entrar</button>
      <p id="error-message" class="error-text"></p>
    </form>
  </div>
  
  <footer>
    <p>Feito por Henrique e Rafael @ SETI/PR</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = e.target.username.value;
      const password = e.target.password.value;
      const errorMessage = document.getElementById('error-message');
      
      // --- INÍCIO DA CORREÇÃO DO ERRO "METHOD NOT ALLOWED" ---
      // Em vez de FormData, usamos URLSearchParams para enviar os dados no formato correto.
      const details = {
          'username': username,
          'password': password
      };
      const formBody = Object.keys(details).map(key => encodeURIComponent(key) + '=' + encodeURIComponent(details[key])).join('&');
      // --- FIM DA CORREÇÃO ---

      try {
        const response = await fetch('/token', {
          method: 'POST',
          // ATUALIZADO: Define o cabeçalho e o corpo da requisição corretamente
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
          },
          body: formBody
        });

        if (!response.ok) {
          const errorData = await response.json();
          // Exibe a mensagem de erro específica retornada pela API
          throw new Error(errorData.detail || 'Falha no login');
        }

        const data = await response.json();
        localStorage.setItem('accessToken', data.access_token);
        // ATUALIZADO: Redireciona para a URL limpa da página principal
        window.location.href = '/app';

      } catch (error) {
        errorMessage.textContent = 'Erro: ' + error.message;
        console.error('Login error:', error);
      }
    });
  </script>
</body>
</html>
